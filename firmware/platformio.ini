; Sniffer pasivo del bus de display (DA/SL) de una balanza
; ACS-JC36CV28  ->  WP-91110-2540-V7  (CS2540 == familia TM1640)
;
;   pio run -t upload -t monitor

[env:esp32-s3-devkitc-1]
platform      = espressif32
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
build_flags   =
    -DCORE_DEBUG_LEVEL=2      ; súbelo para depurar, bájalo a 0 si se pierden bits

lib_deps =
    knolleary/PubSubClient@^2.8   ; solo se usa si ENABLE_WIFI = 1

; --- Otras placas ESP32-S3 -------------------------------------------------
; Seeed XIAO ESP32S3:      board = seeed_xiao_esp32s3
; Freenove ESP32-S3-WROOM: board = esp32-s3-devkitc-1   (compatible)
; Recuerda ajustar PIN_DA / PIN_SL en include/config.h a pines libres <= GPIO31
